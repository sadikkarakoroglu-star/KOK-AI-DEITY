name: K-OS-FINAL-BUILD
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libtool autoconf automake pkg-config gperf
          sudo apt install -y python3-pip git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Build APK
        run: |
          # Giriş kapısını mühürle
          cp calculator_mask.py main.py || cp hesap_makinesi.py main.py || true
          export PATH=$PATH:$HOME/.local/bin
          # Lisansları otomatik onayla ve ateşle
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOK-AI-FINAL-APK
          path: bin/*.apk

